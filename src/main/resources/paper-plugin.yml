# Paper's newer plugin kind: keeps the early bootstrap step open for registry content later.
# `name` is the plugin id and the data folder name (plugins/lullaby/).
# The dollar placeholders are filled in by Gradle (processResources in build.gradle.kts).
name: lullaby
version: '${version}'
main: io.github.kupfermeister.lullaby.Lullaby
# STARTUP: on before the worlds load, so each world reads chunks with Lullaby's codec (custom blocks); the scripts
# still start after all worlds are loaded (Lullaby.java).
load: STARTUP
api-version: '${minecraftVersion}'
description: Lua scripting for Paper servers.
authors: [Kupfermeister]
permissions:
  lullaby.command:
    description: Use /lullaby (reload, version) and /lul (the same as /lullaby reload).
    default: op
  lullaby.data:
    description: Use /lullaby data (look at server.data, the scripts' saved data). Needs lullaby.command too.
    default: op
  lullaby.run:
    description: Use /lullaby run (run any Lua as yourself, wait included; every use is logged). Needs lullaby.command too.
    default: op
  lullaby.blenderbridge:
    description: Use /lullaby blenderbridge and connect Blender (LullaBlend) for your own builds. Needs lullaby.command too.
    default: op
  lullaby.mosaic:
    description: Use /lullaby mosaic (sound mosaicing; working a file out takes much CPU for a while). Needs lullaby.command too.
    default: op
