# Paper's newer plugin kind: keeps the early bootstrap step open for registry content later.
# `name` is the plugin id and the data folder name (plugins/lullaby/).
# The dollar placeholders are filled in by Gradle (processResources in build.gradle.kts).
name: lullaby
version: '${version}'
main: io.github.kupfermeister.lullaby.Lullaby
api-version: '${minecraftVersion}'
description: Lua scripting for Paper servers.
authors: [Kupfermeister]
permissions:
  lullaby.command:
    description: Use /lullaby (reload, version) and /lul (the same as /lullaby reload).
    default: op
  lullaby.data:
    description: Use /lullaby data (look at server.data, the scripts' saved data). Needs lullaby.command too.
    default: op
  lullaby.lullablend:
    description: Use /lullablend and connect Blender (LullaBlend) for your own builds.
    default: op
