<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lullaby Docs</title>
<style>
@font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(fonts/Inter-400.woff2); }
@font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/Inter-600.woff2); }
/* One font for everything, code included (jft 2026-11-22: one easy-to-read font everywhere). SIL Open Font License,
   see fonts/OFL-inter.txt. Stored here, so the site loads nothing from outside. */
/* Lullaby docs site template (tools/docs/site.html). Docs.java puts docs.json in at DOCS below. Dark mode only.
   Every color means one thing: */
:root {
  --bg: #0d0e10; --side: #111315; --box: #121417; --panel: #181a1e; --line: #23262a;
  --text: #e6e8ea; --dim: #868b91;
  --doing: #e07b4c;    /* fresh copper: { } functions */
  --reading: #5fb3a1;  /* oxidized copper: ( ) . : reading */
  --type: #d4a84a;     /* gold: types */
  --event: #a88bd6;    /* violet: events */
  --field: #8fb8de;    /* pale blue: argument / field names */
  --warn: #e8d44d;     /* yellow: warnings (as in-game; gold is only for types) */
  --fresh: #9c4f2b;    /* dark copper (darker than doing), white text: new or changed lately (solid: the newest change) */
  --error: #ff5555;    /* vanilla red: errors */
  /* event status dots: gray until tested and measured, then copper (on{ } can change it) or teal (read only) */
  --dot-untested: #6b7076; --dot-changeable: var(--doing); --dot-readonly: var(--reading);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.6 Inter, system-ui, sans-serif; }
code, .mono { font-family: inherit; font-size: 13.5px; }
a { color: inherit; text-decoration: none; }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }
/* The side list scrolls on its own and never scrolls the page behind it. */
aside { background: var(--side); border-right: 1px solid var(--line); padding: 28px 20px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; }
.brand { font-weight: 600; font-size: 24px; line-height: 1; color: var(--text); margin: 0 0 6px; }
.sub { color: var(--dim); font-size: 12px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
#q { width: 100%; margin-bottom: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px;
  padding: 9px 11px; font: inherit; font-size: 13.5px; outline: none; }
#q:focus { border-color: var(--doing); }
.group { border-top: 1px solid var(--line); margin-top: 12px; padding: 0; }
.group > summary { list-style: none; padding: 12px 0 6px; font-size: 12px; font-weight: 400; user-select: none; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary::before { content: "▸"; display: inline-block; width: 14px; transition: transform .15s; }
.group[open] > summary::before { transform: rotate(90deg); }
.group > summary:hover { color: var(--text); }
.item { display: block; padding: 4px 10px; margin: 0 -10px; border-left: 2px solid transparent; cursor: pointer; }
.item:hover { background: var(--panel); }
.item.on { background: var(--panel); border-left-color: var(--dim); }

main { padding: 40px 48px 80px; max-width: 980px; width: 100%; }
.card { background: var(--box); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.head { padding: 24px 28px 22px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.kind { color: var(--dim); font-size: 13px; }
h1 { font-weight: 600; font-size: 34px; line-height: 1.15; margin: 4px 0 18px; overflow-wrap: anywhere; }
.syntax { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--doing));
  border-radius: 6px; padding: 16px 18px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.lead { font-size: 16px; margin: 16px 0 0; }
section, details { border-top: 1px solid var(--line); padding: 16px 28px; }
h2 { font-size: 13px; font-weight: 600; color: var(--dim); margin: 0 0 8px; }
section table tr:last-child td { border-bottom: 0; }
table { border-collapse: collapse; width: 100%; }
td { padding: 7px 12px 7px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
td:first-child { white-space: nowrap; width: 22%; }
td:nth-child(2) { width: 24%; }
.opt { color: var(--dim); font-size: 12px; }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.links ul { list-style: none; padding: 0; margin: 0; }
.links li { padding: 2px 0; }
.go { cursor: pointer; } .go:hover { text-decoration: underline; text-underline-offset: 3px; }
.arrow { color: var(--dim); margin-right: 6px; }
.note { border-left: 3px solid var(--warn); padding: 8px 12px; margin: 16px 0 0; background: #17150f; border-radius: 0 6px 6px 0; }
.note b { color: var(--warn); font-weight: 600; }
summary { cursor: pointer; color: var(--dim); font-size: 13px; font-weight: 600; }
.nerd { margin-top: 10px; color: var(--dim); }
.nerd td { color: var(--text); }
.src { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
.src a:hover { color: var(--text); }
.draft { display: inline-block; margin-left: 10px; font-size: 11px; color: var(--dim); border: 1px solid var(--line);
  border-radius: 10px; padding: 1px 8px; vertical-align: middle; }
.c-lua { color: var(--text); font-weight: 600; }
.syntax .go:hover, td .go:hover { text-decoration: underline; text-underline-offset: 3px; }
.c-doing { color: var(--doing); } .c-reading { color: var(--reading); } .c-type { color: var(--type); }
.c-event { color: var(--event); } .c-field { color: var(--field); } .c-dim { color: var(--dim); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--dim); }
.empty { color: var(--dim); padding: 4px 8px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px;
  background: var(--dot-untested); flex: none; }
.dot.changeable { background: var(--dot-changeable); } .dot.readonly { background: var(--dot-readonly); }
.dot.unusable { background: transparent; box-shadow: inset 0 0 0 1.5px var(--dot-untested); }
.subgroup { border-top: 0; margin: 0 0 0 4px; }
.subgroup > summary { padding: 6px 0 4px; }
/* long event names (PlayerAdvancementCriterionGrantEvent) wrap anywhere, the dot stays in front of the first line */
.subgroup .item { display: flex; align-items: baseline; font-size: 12.5px; overflow-wrap: anywhere; }
.subgroup .item .dot { transform: translateY(-1px); }
.status { color: var(--dim); font-size: 13px; margin: -8px 0 14px; }
/* the tree of an event's packets (tree: lines, Docs.java): one fold per packet, its fields and their words inside */
details.pkt { border-top: 1px solid var(--line); padding: 0; }
details.pkt:first-of-type { border-top: 0; }
details.pkt > summary { color: var(--text); font-size: 14.5px; font-weight: 400; padding: 8px 0; }
details.pkt > summary .mono { margin-right: 10px; }
details.pkt table { margin: 0 0 8px 18px; width: calc(100% - 18px); }
details.pkt tr.word td:first-child { padding-left: 18px; }
/* new or changed lately (Docs.java fresh): a small filled box. Level 1 (the newest change) is solid; older levels
   are the same box with a see-through fill that blends into the background, then the mark is gone. */
.fresh { display: inline-block; background: var(--fresh); color: #fff; border-radius: 3px; padding: 0 5px;
  margin-left: 8px; font-size: 10.5px; line-height: 16px; font-weight: 600; white-space: nowrap; vertical-align: 1px; }
.fresh.f2 { background: color-mix(in srgb, var(--fresh) 50%, transparent); }
.fresh.f3 { background: color-mix(in srgb, var(--fresh) 25%, transparent); }
.item .fresh { margin-left: 6px; }
/* Guide pages (kind guide): running text from text: in guide.txt, see prose() below */
.prose { border-top: 1px solid var(--line); padding: 8px 28px 20px; }
.prose h3 { font-size: 15px; font-weight: 600; margin: 26px 0 6px; color: var(--text); }
.prose p { margin: 10px 0; } .prose ul, .prose ol { margin: 10px 0; padding-left: 22px; } .prose li { margin: 4px 0; }
.prose .syntax { margin: 12px 0; font-size: 13.5px; }
.prose code { background: var(--panel); border-radius: 4px; padding: 1px 5px; }
.prose a.go { color: var(--reading); text-decoration: underline; text-underline-offset: 3px; }
.tip { border-left: 3px solid var(--reading); padding: 8px 12px; margin: 14px 0; background: #0f1615; border-radius: 0 6px 6px 0; }
.tip b { color: var(--reading); font-weight: 600; }
.pager { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding: 16px 28px; }
.pager a { color: var(--dim); } .pager a:hover { color: var(--text); }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 20px 16px; }
  main { padding: 28px 16px 60px; }
  h1 { font-size: 26px; }
  .prose, .pager { padding-left: 16px; padding-right: 16px; }
  .links { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">Lullaby</div>
    <div class="sub" id="sub">Library</div>
    <input id="q" placeholder="Search" autocomplete="off" spellcheck="false">
    <nav id="nav"></nav>
    <div class="legend">
      <b class="c-lua">lua</b><span class="c-doing">doing { }</span><span class="c-reading">reading ( ) . :</span>
      <span class="c-type">type</span><span class="c-event">event</span><span class="c-field">field</span>
    </div>
    <div class="legend" id="dots"></div>
    <div class="legend"><span><span class="fresh f1">new</span><span class="fresh f2">new</span><span class="fresh f3">new</span></span>
      <span>new or changed lately: solid is the newest change, see-through ones are older</span></div>
  </aside>
  <main id="page"></main>
</div>
<script>
// The data from docs.json (format: see Docs.java). Nothing below knows any entry by name.
const DATA = /*DOCS*/null;
const E = DATA.entries;
const BY = Object.fromEntries(E.map(e => [e.id, e]));
// also: more names that lead to a page (Lua keywords, old page names); a real page of that name wins.
for (const e of E) for (const a of (e.also || "").split(/\s+/).filter(Boolean)) BY[a] ??= e;
const REPO = "https://github.com/Kupfermeister/Lullaby/blob/main/";
const COLOR = { doing:"--doing", reading:"--reading", event:"--event", type:"--type", java:"--dim", lua:"--text", guide:"--text" };
const TYPES = new Set(["text","number","boolean","function","table","nil","nothing","uuid","list",
  ...E.filter(e => e.kind === "type").map(e => e.id)]);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
document.getElementById("sub").textContent = "Docs · Minecraft " + DATA.minecraft;
// Event status dots (Docs.java sets e.dot on generated event pages).
const DOTS = { untested: "not tested yet", changeable: "tested, on{ } can change it", readonly: "tested, read only",
  unusable: "can't be used yet" };
const dot = e => e.dot ? `<span class="dot ${e.dot}" title="${DOTS[e.dot]}"></span>` : "";
// New or changed lately (Docs.java sets e.fresh 1..3, e.freshAs, e.freshDate).
// The box always says "new" (jft 2026-11-22: one small mark); whether the page is new or changed, and when, is in
// its tooltip and, on the page itself, in dim text after the box.
const fresh = (e, long) => e.fresh ? `<span class="fresh f${e.fresh}" title="${esc(e.freshAs)}: ${esc(e.freshDate)}">new</span>${long ? `<span class="c-dim"> ${esc(e.freshAs)} ${esc(e.freshDate)}</span>` : ""}` : "";
// A folded group shows how many of its pages are fresh, at the brightest level among them.
const freshCount = list => { const f = list.filter(e => e.fresh); return f.length ? `<span class="fresh f${Math.min(...f.map(e => +e.fresh))}" title="${f.length} new or changed lately">${f.length}</span>` : ""; };
document.getElementById("dots").innerHTML = Object.entries(DOTS).map(([k, t]) => `<span><span class="dot ${k}"></span>${t}</span>`).join("");

// Lua's keywords: bold, in the normal text color (kind "lua"); a keyword with its own page links to it.
const KEYWORDS = new Set(["and","break","do","else","elseif","end","false","for","function","goto","if","in","local",
  "nil","not","or","repeat","return","then","true","until","while"]);
const link = (id, html) => BY[id] ? `<a class="go" href="#${esc(id)}" data-id="${esc(id)}">${html}</a>` : html;

// Syntax colors come from the text itself: name{ doing, name( reading, name = field, known types gold, keywords bold,
// strings and comments dim. Every name that has a page is a link.
function paint(s) {
  return esc(s).replace(/--[^\n]*|"(?:\.|[^"\\n])*"|'(?:\.|[^'\\n])*'|[A-Za-z_][\w.]*/g, (w, i, all) => {
    if (w[0] === "-" || w[0] === '"' || w[0] === "'") return `<span class="c-dim">${w}</span>`;
    if (KEYWORDS.has(w)) return link(w, `<b class="c-lua">${w}</b>`);
    const after = all.slice(i + w.length).match(/^\s*(\S)/)?.[1];
    if (after === "{") return link(w, `<span class="c-doing">${w}</span>`);
    if (after === "(") return link(w, `<span class="c-reading">${w}</span>`);
    if (after === "=" && all[i + w.length + 1] !== "=") return `<span class="c-field">${w}</span>`;
    if (TYPES.has(w) || BY[w]?.kind === "type") return link(w, `<span class="c-type">${w}</span>`);
    return w;
  });
}
// Type lists like "player · list of player": every type with a page links to it.
const typed = s => esc(s).split(" · ").map(x => `<span class="c-type mono">${x.replace(/[A-Za-z_]\w*/g, w => link(w, w))}</span>`).join(" · ");
function linkList(ids) {
  if (!ids.length) return '<li class="c-dim">—</li>';
  return ids.map(id => `<li><a class="mono go" href="#${esc(id)}" data-id="${esc(id)}" style="color:var(${COLOR[BY[id].kind]})">${esc(BY[id].name)}</a></li>`).join("");
}
// Guide pages: text: is running text. Blank lines split paragraphs; "## " starts a heading; "- " a list item, "1. " a
// numbered one (indented lines continue it); "> " a tip box, "! " a warning box; lines between ``` are code, colored
// like syntax. Inside text: `code` (colored; names with a page link there), **bold**, [words](#id) for a link to a page
// and [words](file) for a file the site publishes next to itself; it downloads (lullaby.d.lua).
function inline(s) {
  return s.split(/(`[^`]+`)/).map(part => part.startsWith("`") && part.length > 1 ? "<code>" + paint(part.slice(1, -1)) + "</code>"
    : esc(part).replace(/\[([^\]]+)\]\(#([^)]+)\)/g, (m, t, id) => '<a class="go" href="#' + id + '" data-id="' + id + '">' + t + '</a>')
      .replace(/\[([^\]]+)\]\(([\w.-]+)\)/g, '<a href="$2" download>$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")).join("");
}
function prose(text) {
  const out = [];
  let para = [], list = null, code = null;
  const block = lines => '<div class="syntax mono" style="--c:var(--line)">' + paint(lines.join("\n")) + "</div>";
  const flush = () => {
    if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; }
    if (list) { out.push("<" + list.tag + ">" + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + "</" + list.tag + ">"); list = null; }
  };
  for (const line of text.split("\n")) {
    const t = line.trim();
    if (code) { if (t === "```") { out.push(block(code)); code = null; } else code.push(line); continue; }
    if (t === "```") { flush(); code = []; continue; }
    const num = t.match(/^\d+\.\s+(.*)/);
    if (!t) flush();
    else if (t.startsWith("## ")) { flush(); out.push("<h3>" + inline(t.slice(3)) + "</h3>"); }
    else if (t.startsWith("> ")) { flush(); out.push('<div class="tip"><b>Tip</b> ' + inline(t.slice(2)) + "</div>"); }
    else if (t.startsWith("! ")) { flush(); out.push('<div class="note"><b>⚠</b> ' + inline(t.slice(2)) + "</div>"); }
    else if (t.startsWith("- ") || num) {
      const tag = num ? "ol" : "ul";
      if (para.length || (list && list.tag !== tag)) flush();
      list ??= { tag, items: [] };
      list.items.push(num ? num[1] : t.slice(2));
    }
    else if (list && line.startsWith("  ")) list.items[list.items.length - 1] += " " + t;
    else { if (list) flush(); para.push(t); }
  }
  if (code) out.push(block(code));
  flush();
  return out.join("");
}
// Guide pages are read in order: the previous and next page of the guide at the bottom.
function pager(e) {
  const g = E.filter(x => x.kind === "guide"), i = g.indexOf(e);
  const a = (x, label) => x ? '<a class="go" href="#' + esc(x.id) + '" data-id="' + esc(x.id) + '">' + label + "</a>" : "<span></span>";
  return '<div class="pager">' + a(g[i - 1], "← " + esc(g[i - 1]?.name)) + a(g[i + 1], esc(g[i + 1]?.name) + " →") + "</div>";
}
// tree: rows [path, type, text] in order: "packet", then its "packet.field" rows, each followed by its
// "packet.field.word" rows. One fold per packet; a packet without fields has nothing to unfold.
function tree(rows) {
  let out = "", open = false;
  for (const [path, t, d] of rows) {
    const p = path.split(".");
    if (p.length === 1) {
      if (open) out += "</table></details>";
      out += `<details class="pkt"><summary><span class="mono c-field">e.packet == "${esc(p[0])}"</span>${esc(d)}</summary><table>`;
      open = true;
    } else if (p.length === 2) {
      out += `<tr><td class="mono c-field">e.${esc(p[1])}</td><td>${BY[t] || TYPES.has(t) ? typed(t) : `<span class="c-dim mono">${esc(t)}</span>`}</td><td>${esc(d)}</td></tr>`;
    } else {
      out += `<tr class="word"><td class="mono"><span class="c-dim">== </span>"${esc(p[2])}"</td><td></td><td>${esc(d)}</td></tr>`;
    }
  }
  return open ? out + "</table></details>" : out;
}
let current = null;
function show(id) {
  const e = BY[id] || E[0];
  if (!e) { document.getElementById("page").innerHTML = '<p class="c-dim">No entries yet.</p>'; return; }
  current = e.id;
  document.querySelectorAll(".item").forEach(a => a.classList.toggle("on", a.dataset.id === e.id));
  const [file, line] = e.src.split(":");
  document.getElementById("page").innerHTML = `
    <div class="card"><div class="head"><div class="top"><div class="kind">${esc(e.group)}${fresh(e, true)}</div><div class="src">${e.paper ? `↗ <a href="${esc(e.paper)}" target="_blank" rel="noopener">Paper</a> · ` : ""}↗ <a href="${REPO}${esc(file)}${line ? "#L" + line : ""}" target="_blank" rel="noopener">${esc(file.split("/").pop())}${line ? ":" + line : ""}</a></div></div>
    <h1 class="${e.kind}${e.sub ? " name" : ""}" style="color:var(${COLOR[e.kind]})">${esc(e.name)}</h1>
    ${e.dot ? `<div class="status">${dot(e)}${esc(DOTS[e.dot])}</div>` : ""}
    ${e.syntax ? `<div class="syntax mono" style="--c:var(${COLOR[e.kind]})">${paint(e.syntax)}</div>` : ""}
    ${e.status === "unconfirmed" ? `<div class="note"><b>⚠</b> Not reviewed by a human yet: this text was written by an AI and may be wrong.</div>` : ""}
    ${e.lead ? `<p class="lead">${esc(e.lead)}</p>` : ""}
    ${e.note ? `<div class="note"><b>⚠</b> ${esc(e.note)}</div>` : ""}</div>
    ${e.text ? `<div class="prose">${prose(e.text)}</div>` : ""}
    ${e.args.length ? `<section><h2>Arguments</h2><table>${e.args.map(([n, t, d]) =>
      `<tr><td class="mono c-field">${esc(n.replace(/\?$/, ""))}${n.endsWith("?") ? ' <span class="opt">optional</span>' : ""}</td><td>${typed(t)}</td><td>${esc(d)}</td></tr>`).join("")}</table></section>` : ""}
    ${e.fields?.length ? `<section><h2>Fields</h2><table>${e.fields.map(([n, t, d]) =>
      `<tr><td class="mono c-field">${e.kind === "event" ? "e." : "."}${esc(n)}</td><td>${BY[t] || TYPES.has(t) ? typed(t) : `<span class="c-dim mono">${esc(t)}</span>`}</td><td>${esc(d)}</td></tr>`).join("")}</table></section>` : ""}
    ${e.tree ? `<section><h2>Packets</h2>${tree(e.tree)}</section>` : ""}
    ${e.returns ? `<section><h2>Returns</h2><div>${typed(e.returns)}</div></section>` : ""}
    ${e.example ? `<section><h2>Example</h2><div class="syntax mono" style="--c:var(--line)">${paint(e.example)}</div></section>` : ""}
    ${e.uses.length || e.usedBy.length ? `<section><h2>Connections</h2>
    <div class="links"><div><div class="c-dim"><span class="arrow">→</span>uses</div><ul>${linkList(e.uses)}</ul></div>
      <div><div class="c-dim"><span class="arrow">←</span>used by</div><ul>${linkList(e.usedBy)}</ul></div></div></section>` : ""}
    ${e.expert.length ? `<details><summary>For experts</summary><table class="nerd">${e.expert.map(([k, v]) =>
      `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table></details>` : ""}
    ${e.kind === "guide" ? pager(e) : ""}
    </div>`;
  document.title = e.name + " · Lullaby Docs";
  // One column (phones): the list sits above the page, so jump to the page itself.
  if (matchMedia("(max-width: 760px)").matches) document.getElementById("page").scrollIntoView();
  else window.scrollTo(0, 0);
}

// Search: /regex/, or typo-tolerant (edit distance against the name's parts and the search words).
function dist(a, b) {
  const m = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = m[0]; m[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const t = m[j]; m[j] = Math.min(m[j] + 1, m[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t;
    }
  }
  return m[b.length];
}
function score(e, q) {
  // CamelCase names are split too: "join" finds PlayerJoinEvent
  const terms = (e.id.replace(/([a-z0-9])([A-Z])/g, "$1 $2") + " " + e.id + " " + (e.words || "")).toLowerCase()
    .split(/[\s_.]+/).filter(Boolean);
  if (e.id.toLowerCase().startsWith(q)) return 0;
  let best = 99;
  for (const t of terms) {
    if (t.startsWith(q)) return 0.5;
    best = Math.min(best, dist(q, t.slice(0, q.length + 1)));
  }
  return best <= Math.max(1, Math.floor(q.length / 3)) ? best : 99;
}
function nav() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  // Raw Java functions (J.*) can't be called from scripts: they keep their pages (reached through "uses") but stay
  // out of the list and the search.
  let list = E.filter(e => e.kind !== "java");
  const rx = q.match(/^\/(.+)\/$/);
  if (rx) { try { const r = new RegExp(rx[1], "i"); list = list.filter(e => r.test(e.id + " " + (e.words || ""))); } catch { list = []; } }
  else if (q) list = list.map(e => [e, score(e, q) + dist(q, e.id.toLowerCase()) / 1000]).filter(x => x[1] < 99)
    .sort((a, b) => a[1] - b[1]).map(x => x[0]); // ties: the closer name first
  const groups = [...new Set(list.map(e => e.group))];
  // Groups fold open and shut; while searching every group with a hit is open. Which groups are shut is remembered
  // in this browser only (and forgotten without error where storage is blocked).
  // A group's pages with a sub group (the generated events: Player, Block, ...) fold into sub groups, shut until
  // opened (remembered like groups) or searched.
  const item = e => `<a class="item mono go" href="#${esc(e.id)}" data-id="${esc(e.id)}" style="color:var(${COLOR[e.kind]})">${dot(e)}<span>${esc(e.name).replace(/([a-z])([A-Z])/g, "$1<wbr>$2")}${fresh(e)}</span></a>`;
  document.getElementById("nav").innerHTML = list.length ? groups.map(g => {
    const inside = list.filter(e => e.group === g);
    const subs = [...new Set(inside.filter(e => e.sub).map(e => e.sub))].sort();
    return `<details class="group" data-g="${esc(g)}"${q || !shut.has(g) ? " open" : ""}><summary>${esc(g)}${freshCount(inside)}</summary>` +
      inside.filter(e => !e.sub).map(item).join("") +
      subs.map(sub => { const key = g + "/" + sub, here = inside.filter(e => e.sub === sub);
        return `<details class="group subgroup" data-s="${esc(key)}"${q || opened.has(key) ? " open" : ""}><summary>${esc(sub)} <span class="c-dim">${here.length}</span>${freshCount(here)}</summary>` +
          here.map(item).join("") + "</details>"; }).join("") + "</details>"; }).join("")
    : '<div class="empty">nothing found</div>';
  document.querySelectorAll(".item").forEach(a => a.classList.toggle("on", a.dataset.id === current));
}
let shut = new Set(), opened = new Set(); // groups start open, sub groups start shut
try { shut = new Set(JSON.parse(localStorage.getItem("lullaby-shut") || "[]")); } catch {}
try { opened = new Set(JSON.parse(localStorage.getItem("lullaby-open") || "[]")); } catch {}
document.getElementById("nav").addEventListener("toggle", ev => {
  if (document.getElementById("q").value.trim()) return; // opening for a search is not the reader's choice
  const s = ev.target.dataset.s;
  if (s) {
    ev.target.open ? opened.add(s) : opened.delete(s);
    try { localStorage.setItem("lullaby-open", JSON.stringify([...opened])); } catch {}
    return;
  }
  const g = ev.target.dataset.g; ev.target.open ? shut.delete(g) : shut.add(g);
  try { localStorage.setItem("lullaby-shut", JSON.stringify([...shut])); } catch {}
}, true);
document.getElementById("q").addEventListener("input", nav);
// Every page has its own address (#id): links, back/forward, bookmarks and new tabs work.
const fromHash = () => show(decodeURIComponent(location.hash.slice(1)) || E[0]?.id);
window.addEventListener("hashchange", fromHash);
nav(); fromHash();
</script>
